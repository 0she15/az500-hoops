<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AZ-500 Hoops</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ═══ HOME SCREEN ═══ -->
<div id="screen-home" class="screen active">
  <div class="home-header">
    <div class="game-title">AZ-500<span>HOOPS</span></div>
    <div class="daily-streak-badge" id="daily-streak-badge">🔥 <span id="daily-streak-num">0</span></div>
  </div>

  <div id="player-card" class="player-card">
    <div class="card-top">
      <div class="card-rating-block">
        <div id="card-rating" class="card-rating">55</div>
        <div id="card-rank-label" class="card-rank-label">ROOKIE</div>
      </div>
      <div class="card-stats">
        <div class="stat-row">
          <span class="stat-label">NET</span>
          <span class="stat-value" id="stat-NET">40</span>
          <div class="mastery-ring" data-domain="NET"><canvas width="28" height="28"></canvas></div>
        </div>
        <div class="stat-row">
          <span class="stat-label">IDN</span>
          <span class="stat-value" id="stat-IDN">40</span>
          <div class="mastery-ring" data-domain="IDN"><canvas width="28" height="28"></canvas></div>
        </div>
        <div class="stat-row">
          <span class="stat-label">CMP</span>
          <span class="stat-value" id="stat-CMP">40</span>
          <div class="mastery-ring" data-domain="CMP"><canvas width="28" height="28"></canvas></div>
        </div>
        <div class="stat-row">
          <span class="stat-label">DFC</span>
          <span class="stat-value" id="stat-DFC">40</span>
          <div class="mastery-ring" data-domain="DFC"><canvas width="28" height="28"></canvas></div>
        </div>
        <div class="stat-row">
          <span class="stat-label">STR</span>
          <span class="stat-value" id="stat-STR">40</span>
          <div class="mastery-ring" data-domain="STR"><canvas width="28" height="28"></canvas></div>
        </div>
      </div>
    </div>
    <div class="card-xp-row">
      <span class="xp-label">LVL <span id="card-level">1</span></span>
      <div class="xp-bar"><div id="xp-bar-fill" class="xp-bar-fill" style="width:0%"></div></div>
      <span class="xp-label" id="xp-next-label">500 XP</span>
    </div>
    <div class="card-badges" id="card-badges"></div>
  </div>

  <div class="section-label">SELECT MODE</div>

  <div class="mode-buttons">
    <button class="mode-btn" data-mode="career">
      <span class="mode-icon">🏀</span>
      <span class="mode-name">CAREER</span>
      <span class="mode-desc">Unlimited · XP always on</span>
    </button>
    <button class="mode-btn mode-blitz" data-mode="blitz">
      <span class="mode-icon">⚡</span>
      <span class="mode-name">BLITZ</span>
      <span class="mode-desc">60 second shot clock</span>
    </button>
    <button class="mode-btn mode-boss" data-mode="bossBattle">
      <span class="mode-icon">💀</span>
      <span class="mode-name">BOSS BATTLE</span>
      <span class="mode-desc">Elite only · 1 miss = game over</span>
    </button>
    <button class="mode-btn mode-sudden" data-mode="suddenDeath">
      <span class="mode-icon">🎯</span>
      <span class="mode-name">SUDDEN DEATH</span>
      <span class="mode-desc">One and done</span>
    </button>
    <button class="mode-btn mode-domain" data-mode="domainMastery">
      <span class="mode-icon">🎓</span>
      <span class="mode-name">DOMAIN MASTERY</span>
      <span class="mode-desc">5 streak in one domain</span>
    </button>
  </div>

  <div id="domain-picker" class="domain-picker hidden">
    <div class="section-label">PICK DOMAIN</div>
    <div class="domain-pick-row">
      <button class="domain-pick-btn" data-domain="NET">NET</button>
      <button class="domain-pick-btn" data-domain="IDN">IDN</button>
      <button class="domain-pick-btn" data-domain="CMP">CMP</button>
      <button class="domain-pick-btn" data-domain="DFC">DFC</button>
      <button class="domain-pick-btn" data-domain="STR">STR</button>
    </div>
  </div>

  <div class="diff-row">
    <div class="section-label">DIFFICULTY</div>
    <div class="diff-buttons">
      <button class="diff-btn active" data-diff="auto">AUTO</button>
      <button class="diff-btn" data-diff="rookie">ROOKIE</button>
      <button class="diff-btn" data-diff="veteran">VETERAN</button>
      <button class="diff-btn" data-diff="elite">ELITE</button>
    </div>
  </div>

  <div class="high-scores" id="high-scores">
    <div class="section-label">HIGH SCORES</div>
    <div class="hs-row"><span>BLITZ</span><span id="hs-blitz">0</span></div>
    <div class="hs-row"><span>SUDDEN DEATH</span><span id="hs-sudden">0</span></div>
    <div class="hs-row"><span>BOSS BATTLE</span><span id="hs-boss">0</span></div>
  </div>

  <button class="reset-btn" id="reset-btn">RESET CARD</button>
</div>

<!-- ═══ GAME SCREEN ═══ -->
<div id="screen-game" class="screen">
  <div class="hud-bar">
    <button class="hud-home-btn" id="hud-home-btn">⬅</button>
    <div class="hud-center">
      <div class="hud-domain" id="hud-domain">NET</div>
      <div class="hud-streak">
        <span class="streak-fire">🔥</span>
        <span id="hud-streak-count">0</span>
        <span class="hud-mult" id="hud-multiplier">1x</span>
      </div>
    </div>
    <div class="shot-clock-wrap" id="shot-clock-wrap">
      <svg class="shot-clock-svg" viewBox="0 0 48 48" width="48" height="48">
        <circle cx="24" cy="24" r="22" fill="none" stroke="#222" stroke-width="3"/>
        <circle id="shot-clock-ring" cx="24" cy="24" r="22" fill="none"
          stroke="var(--neon-blue)" stroke-width="3"
          stroke-dasharray="138.2" stroke-dashoffset="0"
          stroke-linecap="round"
          transform="rotate(-90 24 24)"/>
      </svg>
      <div id="shot-clock-num" class="shot-clock-num">60</div>
    </div>
  </div>

  <div class="question-wrap">
    <div class="q-meta">
      <span class="q-domain-badge" id="q-domain-badge">NET</span>
      <span class="q-diff-badge" id="q-diff-badge">ROOKIE</span>
      <span class="q-type-badge" id="q-type-badge">MC</span>
    </div>
    <div id="question-text" class="question-text"></div>
    <div id="answer-area" class="answer-area"></div>
  </div>

  <div id="explanation-panel" class="explanation-panel hidden">
    <div class="exp-label">ANALYSIS</div>
    <div id="explanation-text" class="explanation-text"></div>
    <button id="explanation-next-btn" class="next-btn">NEXT PLAY →</button>
  </div>
</div>

<!-- ═══ RESULTS SCREEN ═══ -->
<div id="screen-results" class="screen">
  <div class="results-title" id="results-title">GAME OVER</div>
  <div class="results-score" id="results-score">0</div>
  <div class="results-label">CORRECT</div>
  <div class="results-stats" id="results-stats"></div>
  <div class="results-xp" id="results-xp">+0 XP</div>
  <div class="results-hs" id="results-hs"></div>
  <button class="results-home-btn" id="results-home-btn">BACK TO COURT</button>
</div>

<!-- ═══ OVERLAYS ═══ -->

<div id="overlay-feedback" class="overlay hidden">
  <div id="feedback-text" class="feedback-text"></div>
</div>

<div id="floating-xp" class="floating-xp hidden">+50 XP</div>

<div id="overlay-streak" class="overlay overlay-streak hidden">
  <div id="streak-banner" class="streak-banner">
    🔥 <span id="streak-banner-num">3</span> STREAK!
  </div>
</div>

<div id="overlay-level-up" class="overlay overlay-level-up hidden">
  <canvas id="confetti-canvas"></canvas>
  <div id="level-up-card" class="level-up-card">
    <div class="lu-label">LEVEL UP!</div>
    <div class="lu-level" id="lu-level">2</div>
    <div class="lu-rating" id="lu-rating">55</div>
    <div class="lu-rank" id="lu-rank">ROOKIE</div>
    <button class="lu-tap-btn" id="lu-tap-btn">TAP TO CONTINUE</button>
  </div>
</div>

<div id="overlay-boss-fail" class="overlay overlay-boss-fail hidden">
  <div class="boss-fail-card">
    <div class="boss-fail-title">GAME OVER</div>
    <div class="boss-fail-sub">The boss got you</div>
    <div class="boss-fail-count" id="boss-fail-count">0 / 10</div>
    <button class="boss-retry-btn" id="boss-retry-btn">TRY AGAIN</button>
    <button class="boss-home-btn" id="boss-home-btn">BACK TO COURT</button>
  </div>
</div>

<div id="badge-toast" class="badge-toast hidden"></div>

<script src="questions.js"></script>
<script src="app.js"></script>
</body>
</html>
